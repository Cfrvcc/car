name: Deploy Avto Park Karti to save.az

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to save.az/car
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Bundle
        run: npm run build

      # Deploy built 'dist' folder directly to save.az hosting under /public_html/car
      - name: Deploy to Hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/car/
          dangerous-clean-slate: false
